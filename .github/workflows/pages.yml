name: Deploy website a GitHub Pages

on:
  # La v2 (React) es el sitio público: se despliega con cada push a esta rama
  # o manualmente desde Actions -> Run workflow (branch: v2).
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Instalar dependencias
        working-directory: website
        run: npm ci || npm install

      - name: Build
        working-directory: website
        run: npm run build
        env:
          BASE_PATH: /sql-learning/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
